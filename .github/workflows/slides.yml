name: "Build Slides (Marp)"

# docs/slides/ 配下の Marp 用 Markdown を PDF / HTML に変換する。
# - push / PR: 生成物を Actions の artifact としてアップロード
# - main への push: 生成した PDF を docs/slides/roBa-guide.pdf として commit し直す
#   （README からリンクされているファイル。build.yml と同じく「生成物も repo に置く」方針）

on:
  push:
    branches: [main]
    paths:
      - "docs/slides/**/*.md"
      - "docs/slides/themes/**"
      - "docs/slides/build.sh"
      - "keymap-drawer/roBa.svg"
      - ".github/workflows/slides.yml"
  pull_request:
    paths:
      - "docs/slides/**/*.md"
      - "docs/slides/themes/**"
      - "docs/slides/build.sh"
      - "keymap-drawer/roBa.svg"
      - ".github/workflows/slides.yml"
  workflow_dispatch:

concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Chrome は ubuntu-latest に同梱。日本語フォントだけ追加する。
      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          fc-list | grep -i "Noto Sans CJK" | head -n 3

      - name: Build PDF / HTML
        run: ./docs/slides/build.sh dist/slides

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: slides
          path: dist/slides
          if-no-files-found: error

      # main に push されたときだけ、PDF を repo に書き戻す。
      # GITHUB_TOKEN による push は他のワークフローを起動しないのでループしない。
      - name: Commit PDF back to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cp dist/slides/roBa-guide.pdf docs/slides/roBa-guide.pdf
          git add docs/slides/roBa-guide.pdf
          # 未追跡ファイルも拾えるよう、ステージ済みの差分で判定する
          if git diff --cached --quiet; then
            echo "PDF is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[Slides] Update roBa-guide.pdf"
          git push
